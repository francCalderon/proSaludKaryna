name: Deploy → Production

on:
  push:
    branches: [main]

# Protección: requiere aprobación manual antes de desplegar a producción
# Activar en: Settings → Environments → production → Required reviewers
jobs:
  build-and-deploy:
    name: Build frontend + Deploy to production
    runs-on: ubuntu-latest
    environment: production   # requiere aprobación si está configurado en GitHub

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Linux — sin límite nproc)
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://procsalud.cl
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.PROD_STRAPI_URL }}
          STRAPI_HOST: ${{ secrets.PROD_STRAPI_HOST }}
        run: |
          npm ci --production=false
          npm run build

      - name: Deploy al servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/apps/prosalud

            # Actualizar código
            git fetch origin
            git reset --hard origin/main

            # Backend: instalar deps si cambiaron
            cd backend
            npm install --production

            # Reiniciar backend
            mkdir -p tmp && touch tmp/restart.txt

      - name: Copiar .next/ al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'frontend/.next/'
          target: '/home/${{ secrets.SSH_USERNAME }}/apps/prosalud/frontend/'
          strip_components: 1

      - name: Reiniciar frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/apps/prosalud/frontend/tmp
            touch ~/apps/prosalud/frontend/tmp/restart.txt
